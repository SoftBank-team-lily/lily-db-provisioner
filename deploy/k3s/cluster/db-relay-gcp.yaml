# GCP Cloud SQL 로 가는 DB 릴레이 (AWS k3s, 1회 적용)
#
# 멀티클라우드 앱(lily-builder cloudProvider MULTI)은 DB 가 GCP Cloud SQL 하나다. AWS 쪽 Pod 는 Cloud SQL 사설 IP 에
# 닿지 않으므로 이 릴레이가 GCP 배스천(lily-tunnel)으로 ssh -L 을 열어 둔다. AWS 앱의 DB 주소는
# db-relay-gcp.lily-builds.svc.cluster.local:5432 다 (builder 가 GCP provisioner 접속 정보의 호스트만 바꿔 넣는다).
#
# 키와 인증서는 lily-builder(DatabaseRelay)가 Secret db-relay-gcp 에 둔다. 키는 처음 한 번 만들고, 인증서(key ID
# relay-gcp, -L 만)는 24시간짜리를 6시간마다 다시 서명한다. ssh 가 끊기면 Secret 의 최신 인증서로 다시 붙는다.
# Secret 이 생기기 전(builder 기동 30초 뒤)에는 Pod 가 ContainerCreating 으로 기다린다.
#
#   kubectl apply -f db-relay-gcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-relay-gcp
  namespace: lily-builds
  labels:
    app: db-relay-gcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db-relay-gcp
  template:
    metadata:
      labels:
        app: db-relay-gcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache openssh-client >/dev/null
              mkdir -p /tmp/ssh
              while true; do
                cp /relay/id /tmp/ssh/id
                cp /relay/id-cert.pub /tmp/ssh/id-cert.pub
                chmod 600 /tmp/ssh/id
                ssh -N -g -o ExitOnForwardFailure=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
                  -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/ssh/known_hosts -o BatchMode=yes \
                  -i /tmp/ssh/id -o CertificateFile=/tmp/ssh/id-cert.pub \
                  -L 0.0.0.0:5432:"$TUNNEL_REMOTE" "$TUNNEL_USER@$TUNNEL_HOST" || true
                echo "relay: ssh ended, reconnecting"
                sleep 3
              done
          env:
            - name: TUNNEL_HOST
              valueFrom: { secretKeyRef: { name: db-relay-gcp, key: TUNNEL_HOST } }
            - name: TUNNEL_USER
              valueFrom: { secretKeyRef: { name: db-relay-gcp, key: TUNNEL_USER } }
            - name: TUNNEL_REMOTE
              valueFrom: { secretKeyRef: { name: db-relay-gcp, key: TUNNEL_REMOTE } }
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: key
              mountPath: /relay
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: db-relay-gcp
            items:
              - key: id
                path: id
              - key: id-cert.pub
                path: id-cert.pub
---
apiVersion: v1
kind: Service
metadata:
  name: db-relay-gcp
  namespace: lily-builds
spec:
  selector:
    app: db-relay-gcp
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# 사용자 앱(default)과 lily-cicd(lily-system, pgroll 최신 버전 조회)만 릴레이에 붙는다 (같은 namespace 의 Kaniko 빌드 Job 은 막는다)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-relay-gcp
  namespace: lily-builds
spec:
  podSelector:
    matchLabels:
      app: db-relay-gcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lily-system
      ports:
        - port: 5432
