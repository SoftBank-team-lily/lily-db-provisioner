# ECR pull 인증 (클러스터 공용, 1회 적용)
#
# ECR 은 private 이라 k3s 가 이미지를 받으려면 인증이 필요하다. ECR 토큰은 12시간이면 만료되므로
# 6시간마다 노드 IAM 역할(ECR 권한)로 토큰을 받아 각 namespace 의 Secret(ecr-pull)을 갱신하고,
# 그 namespace 의 ServiceAccount 에 imagePullSecrets 로 붙인다.
#   - lily-system: 플랫폼 모듈 (db-provisioner, lily-cicd, lily-builder)
#   - lily-builds: Kaniko 빌드 Job
#   - default:     lily-cicd 가 사용자 앱을 배포하는 namespace
# 적용 후 바로 한 번 실행:  kubectl -n kube-system create job ecr-credentials-init --from=cronjob/ecr-credentials
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-credentials
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecr-credentials
subjects:
  - kind: ServiceAccount
    name: ecr-credentials
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecr-credentials
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credentials
  namespace: kube-system
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: ecr-credentials
          restartPolicy: OnFailure
          containers:
            - name: refresh
              # 토큰 발급(aws)과 Secret 갱신(kubectl)을 한 컨테이너에서. kubectl 은 공식 배포처에서 받는다
              image: amazon/aws-cli:2.22.0
              env:
                - name: REGISTRY
                  value: 703592323320.dkr.ecr.ap-northeast-2.amazonaws.com
                - name: NAMESPACES
                  value: "lily-system lily-builds default"
                - name: KUBECTL_VERSION
                  value: v1.31.4
              command:
                - sh
                - -c
                - |
                  set -e
                  curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
                  chmod +x /tmp/kubectl; K=/tmp/kubectl
                  PASSWORD=$(aws ecr get-login-password --region ap-northeast-2)
                  for ns in $NAMESPACES; do
                    $K get namespace "$ns" >/dev/null 2>&1 || { echo "skip $ns (not found)"; continue; }
                    $K -n "$ns" create secret docker-registry ecr-pull                       --docker-server="$REGISTRY" --docker-username=AWS --docker-password="$PASSWORD"                       --dry-run=client -o yaml | $K apply -f - >/dev/null
                    for sa in $($K -n "$ns" get serviceaccounts -o name); do
                      $K -n "$ns" patch "$sa" -p '{"imagePullSecrets":[{"name":"ecr-pull"}]}' >/dev/null
                    done
                    echo "refreshed $ns"
                  done
